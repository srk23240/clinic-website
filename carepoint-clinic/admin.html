
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CarePoint Clinic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="contact-main">
        <div class="container">
            <div class="contact-form-card" style="max-width: 450px; margin: 80px auto;">
                <h2>CarePoint Admin</h2>
                <p>Sign in to manage clinic enquiries.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>

                    <button type="submit" id="loginButton">
                        Sign In
                    </button>

                    <p id="loginStatus" class="form-status" role="status"></p>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://ivhmelpycrzanhgyflrx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_awgv-rUhZhUn2ZTQLS2kqg_eftPJ6WK";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const loginStatus = document.getElementById("loginStatus");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                loginStatus.textContent = error.message;
                loginStatus.className = "form-status error";
            } else {
                window.location.href = "dashboard.html";
            }

            loginButton.disabled = false;
            loginButton.textContent = "Sign In";
        });
    </script>

</body>
</html>
